# arena.toml — player registry for ./bin/arena (EPIC-42 Dynamic Arena Runner).
#
# Maps short player names to an agent type + config. `bin/arena` reads this file
# to build an ad-hoc table from the command line, e.g.:
#
#   ./bin/arena gto gto lag llama          # two GTO bots, a LAG bot, one llama
#   ./bin/arena gto:3 claude               # colon multiplicity shorthand
#
# The registry is additive: new entries here need no script changes.
#
# `type` must be one of: rules | ollama | claude | gemini | boss
#   rules  — pkdealer_agent_rules,  uses `profile` (a pkcore built-in archetype)
#   ollama — pkdealer_agent_ollama, uses `model` (talks to host `ollama serve`)
#   claude — pkdealer_agent_claude, uses `model`  ┐ live LLM, needs an API key
#   gemini — pkdealer_agent_gemini, uses `model`  ┘
#   boss   — pkdealer_agent_boss (EPIC-70 Phase 4): the live blind collusion
#            detector. An observer, not a seat — it takes no profile and never
#            joins the table; it polls ExportSession under the spectator token
#            and emits per-pair SPRT verdicts over OTel.
#
# `team` (optional, rules-only) — EPIC-70 collusion: the two seats sharing a
#   team id secretly collude. bin/arena expands membership into explicit
#   --collude-with / --collusion-channel / --collusion-style flags on each
#   member (pairs only; a team with ≠2 seats in the lineup is rejected).
# `style` (optional, teamed seats) — collusion strategy: soft | whipsaw | dump
#   (default soft).
# `channel` (optional, teamed seats) — card-leak vector: spectator | peer
#   (default spectator). `spectator` reads the partner's cards via the dealer's
#   spectator token (Vector A); `peer` shares them over a `pkdealer_backchannel`
#   broker service that bin/arena spins up automatically when any peer colluder
#   is in the lineup (Vector B). Both teammates should set the same channel.
#
# ── TODO / availability (EPIC-42 scope) ───────────────────────────────────────
#   claude  — requires ANTHROPIC_API_KEY in the calling shell (live, billed).
#             bin/arena emits the container but warns when the key is missing.
#             TODO: verify a live Claude run once a key is available.
#   gwen    — type = gemini: the pkdealer_agent_gemini crate is NOT YET BUILT
#             (EPIC-42 Phase 3, deferred — no API key on hand). Selecting `gwen`
#             makes bin/arena exit with a clear "not yet implemented" message
#             rather than attempting an un-buildable container.

[players.gto]
type    = "rules"
profile = "gto"

[players.lag]
type    = "rules"
profile = "loose_aggressive"

[players.tag]
type    = "rules"
profile = "tight_aggressive"

[players.tp]
type    = "rules"
profile = "tight_passive"

[players.lp]
type    = "rules"
profile = "loose_passive"

[players.maniac]
type    = "rules"
profile = "maniac"

[players.abc]
type    = "rules"
profile = "abc"

[players.ssn]
type    = "rules"
profile = "short_stack_ninja"

[players.joker]
type    = "rules"
profile = "joker"

# EPIC-70 colluding pair — mallory & trudy secretly share hole cards via the
# spectator token (Vector A). Seat them with honest bots: ./bin/arena mallory trudy gto lag
[players.mallory]
type    = "rules"
profile = "tight_aggressive"
team    = "A"

[players.trudy]
type    = "rules"
profile = "loose_aggressive"
team    = "A"

# EPIC-70 colluding pair — carol & dave share hole cards over the peer
# backchannel broker (Vector B), no spectator token. bin/arena auto-adds the
# pkdealer_backchannel service: ./bin/arena carol dave gto lag
[players.carol]
type    = "rules"
profile = "tight_aggressive"
team    = "B"
style   = "dump"
channel = "peer"

[players.dave]
type    = "rules"
profile = "loose_aggressive"
team    = "B"
style   = "dump"
channel = "peer"

# EPIC-70 Phase 4 — the live blind Boss. Add it to any lineup to watch for
# collusion in real time: ./bin/arena mallory trudy gto lag boss
[players.boss]
type = "boss"

[players.llama]
type  = "ollama"
model = "llama3.1"

[players.mistral]
type  = "ollama"
model = "mistral"

[players.gemma]
type  = "ollama"
model = "gemma2"

[players.claude]
type  = "claude"
model = "claude-sonnet-4-6"

[players.gwen]
type  = "gemini"
model = "gemini-2.0-flash"

# PokerBench-guided variants (EPIC-43/44). Built by `make pokerbench-models`,
# which bakes sampled solver-optimal decisions into each base model's system
# prompt via `ollama create`. Seat them like any ollama player, e.g.
#   ./bin/arena pkgemma gto lag
[players.pkgemma]
type  = "ollama"
model = "pkpoker-gemma"

[players.pkllama]
type  = "ollama"
model = "pkpoker-llama"

[players.pkmistral]
type  = "ollama"
model = "pkpoker-mistral"

# Small/fast PokerBench variant (EPIC-43/44). Same baked-in solver-optimal
# examples as the others, but FROM qwen2.5:3b (~1.9GB) instead of the 9B gemma2,
# so it decides with much lower latency. Seat it like any ollama player, e.g.
#   ./bin/arena pkqwen gto lag tag
[players.pkqwen]
type  = "ollama"
model = "pkpoker-qwen"
