# Reusable agent pacing knobs, merged into every agent's environment below.
# Both default to the values baked into pkdealer_agent_core and are overridable
# from the host shell, e.g.:
#   PKDEALER_ACTION_DELAY_SECS=2 PKDEALER_SHOWDOWN_DELAY_SECS=8 ./bin/aiarena
# Set an action delay of 0 to remove the per-action pause entirely.
x-agent-pacing: &agent-pacing
  PKDEALER_ACTION_DELAY_SECS: ${PKDEALER_ACTION_DELAY_SECS:-1}
  PKDEALER_SHOWDOWN_DELAY_SECS: ${PKDEALER_SHOWDOWN_DELAY_SECS:-5}

services:
  pkdealer_service:
    build:
      context: .
      dockerfile: crates/pkdealer_service/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: pkdealer_service
      RUST_LOG: pkdealer_service=info,info
      # Keep the demo running indefinitely: top up any seat that busts to $0
      # at end-of-hand, so the table can always start the next hand. Without
      # this, busted seats stay occupied at 0 chips and pkcore refuses to deal
      # ("Insufficient chips Error"), wedging the whole table.
      PKDEALER_REBUY_ON_BUST_ENABLED: "true"
      PKDEALER_REBUY_AMOUNT: "10000"
    ports: ["50051:50051"]
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./ops/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "8889:8889"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Viewer is sufficient for the demo — datasources and dashboards
      # are file-provisioned, so anonymous users never need to write.
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]

  # ── agent containers ──────────────────────────────────────────────────
  # Agents are grouped by compose `profiles`, so one file drives two demos:
  #
  #   profile "aiarena" (./bin/aiarena) — 6 players:
  #     three rule bots (gto, lag, tag) + three LLMs (llama, mistral, gemma).
  #   profile "botarena" (./bin/botarena) — all 9 pkcore rule archetypes:
  #     gto, tag, lag, tp, lp, maniac, abc, ssn, joker (a full 9-seat ring).
  #
  # gto/lag/tag carry BOTH profiles, so they appear in either demo; the LLMs
  # are aiarena-only and the six extra archetypes are botarena-only. Infra
  # services above carry no profile, so they always start.
  #
  # Rule bots (pkdealer_agent_rules) take a pkcore built-in `--profile`. LLMs
  # (pkdealer_agent_ollama) talk to a host-side `ollama serve` via
  # host.docker.internal, differing only in OLLAMA_MODEL (override with the
  # matching *_MODEL env var). All agents share Dockerfile.agent; BIN_NAME
  # selects the binary.

  agent_gto:
    image: pkdealer/agent_rules:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BIN_NAME: pkdealer_agent_rules
    command: ["--name", "gto", "--profile", "gto"]
    profiles: ["aiarena", "botarena"]
    environment:
      <<: *agent-pacing
      PKDEALER_ENDPOINT: http://pkdealer_service:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent_gto
      RUST_LOG: info
    depends_on:
      - pkdealer_service
      - otel-collector

  agent_lag:
    image: pkdealer/agent_rules:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BIN_NAME: pkdealer_agent_rules
    command: ["--name", "lag", "--profile", "loose_aggressive"]
    profiles: ["aiarena", "botarena"]
    environment:
      <<: *agent-pacing
      PKDEALER_ENDPOINT: http://pkdealer_service:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent_lag
      RUST_LOG: info
    depends_on:
      - pkdealer_service
      - otel-collector

  agent_tag:
    image: pkdealer/agent_rules:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BIN_NAME: pkdealer_agent_rules
    command: ["--name", "tag", "--profile", "tight_aggressive"]
    profiles: ["aiarena", "botarena"]
    environment:
      <<: *agent-pacing
      PKDEALER_ENDPOINT: http://pkdealer_service:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent_tag
      RUST_LOG: info
    depends_on:
      - pkdealer_service
      - otel-collector

  agent_llama:
    image: pkdealer/agent_ollama:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BIN_NAME: pkdealer_agent_ollama
    command: ["--name", "llama"]
    profiles: ["aiarena"]
    environment:
      <<: *agent-pacing
      PKDEALER_ENDPOINT: http://pkdealer_service:50051
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${LLAMA_MODEL:-llama3.1}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent_llama
      RUST_LOG: info
    extra_hosts:
      # Lets the container resolve host.docker.internal on Linux.
      # No-op (already mapped) on Docker Desktop for macOS/Windows.
      - "host.docker.internal:host-gateway"
    depends_on:
      - pkdealer_service
      - otel-collector

  agent_mistral:
    image: pkdealer/agent_ollama:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BIN_NAME: pkdealer_agent_ollama
    command: ["--name", "mistral"]
    profiles: ["aiarena"]
    environment:
      <<: *agent-pacing
      PKDEALER_ENDPOINT: http://pkdealer_service:50051
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${MISTRAL_MODEL:-mistral}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent_mistral
      RUST_LOG: info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pkdealer_service
      - otel-collector

  agent_gemma:
    image: pkdealer/agent_ollama:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BIN_NAME: pkdealer_agent_ollama
    command: ["--name", "gemma"]
    profiles: ["aiarena"]
    environment:
      <<: *agent-pacing
      PKDEALER_ENDPOINT: http://pkdealer_service:50051
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${GEMMA_MODEL:-gemma2}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent_gemma
      RUST_LOG: info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pkdealer_service
      - otel-collector

  # ── botarena-only archetypes ──────────────────────────────────────────
  # The six remaining pkcore rule profiles, joining gto/lag/tag (above) to
  # seat a full 9-handed ring of distinct strategies. Active only under the
  # "botarena" profile (./bin/botarena).

  agent_tp:
    image: pkdealer/agent_rules:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BIN_NAME: pkdealer_agent_rules
    command: ["--name", "tp", "--profile", "tight_passive"]
    profiles: ["botarena"]
    environment:
      <<: *agent-pacing
      PKDEALER_ENDPOINT: http://pkdealer_service:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent_tp
      RUST_LOG: info
    depends_on:
      - pkdealer_service
      - otel-collector

  agent_lp:
    image: pkdealer/agent_rules:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BIN_NAME: pkdealer_agent_rules
    command: ["--name", "lp", "--profile", "loose_passive"]
    profiles: ["botarena"]
    environment:
      <<: *agent-pacing
      PKDEALER_ENDPOINT: http://pkdealer_service:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent_lp
      RUST_LOG: info
    depends_on:
      - pkdealer_service
      - otel-collector

  agent_maniac:
    image: pkdealer/agent_rules:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BIN_NAME: pkdealer_agent_rules
    command: ["--name", "maniac", "--profile", "maniac"]
    profiles: ["botarena"]
    environment:
      <<: *agent-pacing
      PKDEALER_ENDPOINT: http://pkdealer_service:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent_maniac
      RUST_LOG: info
    depends_on:
      - pkdealer_service
      - otel-collector

  agent_abc:
    image: pkdealer/agent_rules:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BIN_NAME: pkdealer_agent_rules
    command: ["--name", "abc", "--profile", "abc"]
    profiles: ["botarena"]
    environment:
      <<: *agent-pacing
      PKDEALER_ENDPOINT: http://pkdealer_service:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent_abc
      RUST_LOG: info
    depends_on:
      - pkdealer_service
      - otel-collector

  agent_ssn:
    image: pkdealer/agent_rules:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BIN_NAME: pkdealer_agent_rules
    command: ["--name", "ssn", "--profile", "short_stack_ninja"]
    profiles: ["botarena"]
    environment:
      <<: *agent-pacing
      PKDEALER_ENDPOINT: http://pkdealer_service:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent_ssn
      RUST_LOG: info
    depends_on:
      - pkdealer_service
      - otel-collector

  agent_joker:
    image: pkdealer/agent_rules:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BIN_NAME: pkdealer_agent_rules
    command: ["--name", "joker", "--profile", "joker"]
    profiles: ["botarena"]
    environment:
      <<: *agent-pacing
      PKDEALER_ENDPOINT: http://pkdealer_service:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent_joker
      RUST_LOG: info
    depends_on:
      - pkdealer_service
      - otel-collector
