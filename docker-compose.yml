services:
  pkdealer_service:
    build:
      context: .
      dockerfile: crates/pkdealer_service/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: pkdealer_service
      RUST_LOG: pkdealer_service=info,info
    ports: ["50051:50051"]
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./ops/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "8889:8889"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Viewer is sufficient for the demo — datasources and dashboards
      # are file-provisioned, so anonymous users never need to write.
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]

  # ── agent containers ──────────────────────────────────────────────────
  # All agents share Dockerfile.agent; BIN_NAME selects the binary.
  # Rule-based bots use pkcore built-in profile names (gto, loose_aggressive,
  # tight_aggressive). The ollama agent talks to a host-side `ollama serve`
  # via host.docker.internal.

  agent_gto:
    image: pkdealer/agent_rules:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BIN_NAME: pkdealer_agent_rules
    command: ["--name", "gto", "--profile", "gto"]
    environment:
      PKDEALER_ENDPOINT: http://pkdealer_service:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent_gto
      RUST_LOG: info
    depends_on:
      - pkdealer_service
      - otel-collector

  agent_lag:
    image: pkdealer/agent_rules:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BIN_NAME: pkdealer_agent_rules
    command: ["--name", "lag", "--profile", "loose_aggressive"]
    environment:
      PKDEALER_ENDPOINT: http://pkdealer_service:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent_lag
      RUST_LOG: info
    depends_on:
      - pkdealer_service
      - otel-collector

  agent_tag:
    image: pkdealer/agent_rules:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BIN_NAME: pkdealer_agent_rules
    command: ["--name", "tag", "--profile", "tight_aggressive"]
    environment:
      PKDEALER_ENDPOINT: http://pkdealer_service:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent_tag
      RUST_LOG: info
    depends_on:
      - pkdealer_service
      - otel-collector

  agent_random:
    image: pkdealer/agent_random:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BIN_NAME: pkdealer_agent_random
    command: ["--name", "random"]
    environment:
      PKDEALER_ENDPOINT: http://pkdealer_service:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent_random
      RUST_LOG: info
    depends_on:
      - pkdealer_service
      - otel-collector

  agent_ollama:
    image: pkdealer/agent_ollama:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BIN_NAME: pkdealer_agent_ollama
    command: ["--name", "llama"]
    environment:
      PKDEALER_ENDPOINT: http://pkdealer_service:50051
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: agent_ollama
      RUST_LOG: info
    extra_hosts:
      # Lets the container resolve host.docker.internal on Linux.
      # No-op (already mapped) on Docker Desktop for macOS/Windows.
      - "host.docker.internal:host-gateway"
    depends_on:
      - pkdealer_service
      - otel-collector
