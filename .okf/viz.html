const NODES=[{"id": "crates/pkdealer_agent_claude", "type": "Rust Crate", "title": "pkdealer_agent_claude", "description": "Claude LLM poker agent for pkdealer with OTel gen_ai instrumentation.", "tags": ["binary", "agents", "llm", "claude", "otel"], "group": "crates", "sz": 25, "body": "Binary agent backed by the Anthropic Claude API via the `LlmBackend` trait\nfrom [pkdealer_agent_llm](/crates/pkdealer_agent_llm.md). Requires\n`ANTHROPIC_API_KEY` in the calling shell \u2014 calls are **live and billed**.\nEmits OTel `gen_ai` spans so model calls are traceable end-to-end (see the\n[observability runbook](/runbooks/observability.md))."}, {"id": "crates/pkdealer_agent_core", "type": "Rust Crate", "title": "pkdealer_agent_core", "description": "Shared gRPC agent infrastructure used by every pkdealer bot agent.", "tags": ["library", "agents", "grpc"], "group": "crates", "sz": 26, "body": "Library crate with the common plumbing every bot agent shares: connecting to\nthe [dealer service](/crates/pkdealer_service.md), seating itself, polling for\nits turn, and submitting actions over the\n[Dealer gRPC API](/interfaces/dealer-grpc-api.md).\n\nConsumers: [pkdealer_agent_random](/crates/pkdealer_agent_random.md),\n[pkdealer_agent_rules](/crates/pkdealer_agent_rules.md),\n[pkdealer_agent_claude](/crates/pkdealer_agent_claude.md),\n[pkdealer_agent_ollama](/crates/pkdealer_agent_ollama.md)."}, {"id": "crates/pkdealer_agent_llm", "type": "Rust Crate", "title": "pkdealer_agent_llm", "description": "Shared LlmBackend trait and poker-prompt logic used by LLM-backed pkdealer agents.", "tags": ["library", "agents", "llm"], "group": "crates", "sz": 25, "body": "Library crate defining the `LlmBackend` trait plus the prompt construction and\nresponse parsing shared by LLM-backed agents. Backends implement the trait;\nthis crate turns table state into a poker prompt and an LLM reply into a legal\naction.\n\nConsumers: [pkdealer_agent_claude](/crates/pkdealer_agent_claude.md),\n[pkdealer_agent_ollama](/crates/pkdealer_agent_ollama.md)."}, {"id": "crates/pkdealer_agent_ollama", "type": "Rust Crate", "title": "pkdealer_agent_ollama", "description": "Ollama-backed local-LLM poker agent for pkdealer with OTel gen_ai instrumentation.", "tags": ["binary", "agents", "llm", "ollama", "otel"], "group": "crates", "sz": 25, "body": "Binary agent backed by a local Ollama model via the `LlmBackend` trait from\n[pkdealer_agent_llm](/crates/pkdealer_agent_llm.md). Requires Ollama running\non the host but no API keys \u2014 fully local and free. Emits OTel `gen_ai` spans\n(see the [observability runbook](/runbooks/observability.md)). Used by\n`./bin/aiarena` for the full demo stack."}, {"id": "crates/pkdealer_agent_random", "type": "Rust Crate", "title": "pkdealer_agent_random", "description": "Random baseline bot agent for pkdealer.", "tags": ["binary", "agents", "baseline"], "group": "crates", "sz": 25, "body": "Binary agent that picks legal actions at random. Serves as the baseline\nopponent for evaluating smarter agents. Built on\n[pkdealer_agent_core](/crates/pkdealer_agent_core.md); runs fully locally with\nno external dependencies."}, {"id": "crates/pkdealer_agent_rules", "type": "Rust Crate", "title": "pkdealer_agent_rules", "description": "Rule-based poker bot agent driven by a pkcore BotProfile archetype.", "tags": ["binary", "agents", "pkcore"], "group": "crates", "sz": 25, "body": "Binary agent whose strategy comes from a `pkcore` `BotProfile` archetype\n(e.g. GTO-leaning, loose-aggressive). The full 9-handed ring of archetypes is\nwhat `./bin/botarena` launches \u2014 see the [arena runbook](/runbooks/arena.md).\nBuilt on [pkdealer_agent_core](/crates/pkdealer_agent_core.md); runs fully\nlocally."}, {"id": "crates/pkdealer_client", "type": "Rust Crate", "title": "pkdealer_client", "description": "gRPC client binary that connects to the dealer service; also hosts the 9-player demo binary.", "tags": ["binary", "client", "grpc"], "group": "crates", "sz": 26, "body": "gRPC client for the [dealer service](/crates/pkdealer_service.md). Ships a\nsecond binary, `demo`, used by `make demo` to run the 9-player client demo\nagainst a running service.\n\n# Configuration\n\n| Variable | Default | Description |\n|---|---|---|\n| `PKDEALER_ENDPOINT` | `http://127.0.0.1:50051` | Service endpoint to connect to |\n| `PKDEALER_CLIENT_ID` | `pkdealer-client` | Client identifier sent in ping requests |"}, {"id": "crates/pkdealer_costsim", "type": "Rust Crate", "title": "pkdealer_costsim", "description": "Offline token-accounting and notional-cost analysis over recorded pkdealer arena sessions.", "tags": ["binary", "cost", "tokens", "epic-44"], "group": "crates", "sz": 25, "body": "Offline analysis tool (EPIC-44 Phase 0) that replays recorded arena sessions\n(exported via the `ExportSession` RPC \u2014 see\n[Dealer gRPC API](/interfaces/dealer-grpc-api.md)) and computes token usage\nand notional cost per agent, using prices from\n[pkdealer_pricing](/crates/pkdealer_pricing.md).\nSee [EPIC docs](/references/epic-docs.md) for the design spec."}, {"id": "crates/pkdealer_pricing", "type": "Rust Crate", "title": "pkdealer_pricing", "description": "Notional per-model token pricing and cost computation, shared by the service and offline analysis.", "tags": ["library", "cost", "tokens", "epic-44"], "group": "crates", "sz": 25, "body": "Library crate (EPIC-44) providing per-model token pricing and cost\ncomputation. Prices are configured in the repo-root `pricing.toml`. Shared by\nthe [service](/crates/pkdealer_service.md) (live token/cost columns) and\n[pkdealer_costsim](/crates/pkdealer_costsim.md) (offline analysis).\nSee [EPIC docs](/references/epic-docs.md) for the design spec."}, {"id": "crates/pkdealer_proto", "type": "Rust Crate", "title": "pkdealer_proto", "description": "Shared protobuf definitions and tonic-generated Rust types for pkdealer.", "tags": ["library", "protobuf", "grpc"], "group": "crates", "sz": 26, "body": "Library crate holding the single protobuf schema (`proto/dealer.proto`) and\nthe Rust types tonic generates from it. Every other crate in the workspace \u2014\nthe [service](/crates/pkdealer_service.md), the\n[client](/crates/pkdealer_client.md), and all agents via\n[pkdealer_agent_core](/crates/pkdealer_agent_core.md) \u2014 depends on this crate\nfor the wire contract described in\n[Dealer gRPC API](/interfaces/dealer-grpc-api.md).\n\nCode generation runs in `build.rs` via `tonic-build` using\n`protoc-bin-vendored`, so no system `protoc` installation is required."}, {"id": "crates/pkdealer_service", "type": "Rust Crate", "title": "pkdealer_service", "description": "The gRPC dealer server binary \u2014 implements DealerService and manages the poker table.", "tags": ["binary", "service", "grpc", "otel"], "group": "crates", "sz": 28, "body": "Binary crate implementing `DealerService` (see\n[Dealer gRPC API](/interfaces/dealer-grpc-api.md)): seating, dealing,\naction processing, street advancement, showdown resolution, event streaming,\nand session export. It is OpenTelemetry-instrumented \u2014 see the\n[observability runbook](/runbooks/observability.md).\n\n# Configuration\n\n| Variable | Default | Description |\n|---|---|---|\n| `PKDEALER_ADDR` | `127.0.0.1:50051` | Address the service listens on |\n| `OTEL_SDK_DISABLED` | unset | Set `true` to run without a collector (tests, bare `cargo run`) |\n\nThe crate's own `README.md` documents the full environment-variable set and\nobservability quickstart.\n\n# Examples\n\n```sh\ncargo run -p pkdealer_service                       # default bind\nPKDEALER_ADDR=0.0.0.0:9090 cargo run -p pkdealer_service\ncargo test -p pkdealer_service --test e2e_ping      # end-to-end ping test\n```"}, {"id": "getting-started", "type": "Project Overview", "title": "PKDealer \u2014 gRPC Poker Dealer Service", "description": "Rust workspace providing a gRPC poker dealer service, client, shared protobuf definitions, and a family of bot agents.", "tags": ["poker", "grpc", "rust", "agents", "overview"], "group": "(root)", "sz": 30, "body": "# Overview\n\nPKDealer is a Rust workspace (edition 2024, 11 member crates) built around a\ngRPC **dealer service** that manages a poker table: seating players, dealing\nhands, processing actions (bet / call / raise / fold), advancing streets, and\nresolving showdowns. Bot agents connect over gRPC and play autonomously \u2014\nrule-based archetypes from the upstream `pkcore` crate, a random baseline, and\nlive LLM players backed by Claude or a local Ollama model.\n\nStart here, then follow:\n\n* [Crates](/crates/index.md) \u2014 one concept per workspace crate.\n* [Dealer gRPC API](/interfaces/dealer-grpc-api.md) \u2014 the wire contract.\n* [Arena runbook](/runbooks/arena.md) \u2014 composing tables of bots.\n* [Observability runbook](/runbooks/observability.md) \u2014 the OTel stack.\n* [Developer workflow](/runbooks/developer-workflow.md) \u2014 build, test, lint.\n* [EPIC docs](/references/epic-docs.md) \u2014 where design work is specified.\n\n# Key facts\n\n| Fact | Value |\n|---|---|\n| Workspace root | `Cargo.toml` (resolver 2, 11 crates under `crates/`) |\n| Upstream domain crate | `pkcore` (hand evaluation, bot profiles) |\n| Wire format | Protobuf / tonic gRPC (`proto/dealer.proto`) |\n| Spectator UI | Separate repo: [pkspectator](https://github.com/ImperialBower/pkspectator) |\n| License | MIT OR Apache-2.0 |\n\n# Citations\n\n[1] [README.md](https://github.com/ImperialBower/pkdealer/blob/main/README.md)"}, {"id": "interfaces/dealer-grpc-api", "type": "API Contract", "title": "Dealer gRPC API (DealerService)", "description": "The protobuf/gRPC contract for the poker dealer \u2014 seating, hands, actions, queries, event streaming, and session export.", "tags": ["grpc", "protobuf", "api"], "group": "interfaces", "sz": 30, "body": "Defined in `proto/dealer.proto` (~420 lines), compiled by\n[pkdealer_proto](/crates/pkdealer_proto.md), implemented by\n[pkdealer_service](/crates/pkdealer_service.md), and consumed by the\n[client](/crates/pkdealer_client.md) and all agents via\n[pkdealer_agent_core](/crates/pkdealer_agent_core.md).\n\n# Schema\n\n| RPC | Purpose |\n|---|---|\n| `Ping` | Liveness check with client id |\n| `SeatPlayer` / `SeatPlayerAt` | Seat a player (next free seat / specific seat) |\n| `RemovePlayer` | Remove a player from the table |\n| `StartHand` | Deal a new hand |\n| `Act` | Submit a player action (bet / call / raise / fold) |\n| `GetStatus` / `GetNextToAct` | Table state and turn order queries |\n| `GetBoard` / `GetChips` / `GetPot` | Board cards, stacks, pot queries |\n| `GetEventLog` / `GetTableConfig` | Event history and table configuration |\n| `Rebuy` | Add chips to the caller's seat (`chips == 0` uses the service default) |\n| `GetPlayerStats` | Per-player statistics |\n| `StreamEvents` | Server-streaming table events (spectators, recorders) |\n| `ExportSession` / `GetSessionInfo` | Recorded-session export (YAML/JSON) and metadata |\n\n`StreamEvents` and `ExportSession` are what the arena recorder and\n[pkdealer_costsim](/crates/pkdealer_costsim.md) build on.\n\n# Citations\n\n[1] [proto/dealer.proto](https://github.com/ImperialBower/pkdealer/blob/main/proto/dealer.proto)"}, {"id": "references/epic-docs", "type": "Reference", "title": "EPIC design docs", "description": "Design work is specified as numbered EPIC documents under docs/; closed EPICs carry a -CLOSED suffix.", "tags": ["docs", "epics", "process"], "group": "references", "sz": 29, "body": "All substantial design work is written up as a numbered `EPIC-NN_*.md`\ndocument in `docs/` before implementation: Context, Status table, Design\nsketches, phased Work Items, and a Verification block. Suffix conventions:\n`-CLOSED` (done), `-INC` (incomplete/paused). `docs/BACKLOG.md` and\n`docs/TECHNICAL_DEBT.md` track outstanding work.\n\n# Notable EPICs (as of 2026-07-22)\n\n| EPIC | Topic | Status |\n|---|---|---|\n| 20\u201324 | Autonomous game loop, spectator, OTel, bot agents, demo | closed |\n| 25 | Arena recorder & session export | active |\n| 40 | Local LLM backend | incomplete |\n| 41 | Reproducible scenarios | active |\n| 42 | Dynamic arena runner (`./bin/arena`) | incomplete |\n| 43 | PokerBench integration (cross-repo with `pkcore`) | active |\n| 44 | Token accounting & cost simulation ([pricing](/crates/pkdealer_pricing.md), [costsim](/crates/pkdealer_costsim.md)) | incomplete |\n| 45 | Bot evaluation format | active |\n| 46 | Collusion simulation & detection | active |\n\n# Citations\n\n[1] [docs/ directory](https://github.com/ImperialBower/pkdealer/tree/main/docs)"}, {"id": "runbooks/arena", "type": "Runbook", "title": "Arena \u2014 launching tables of bots", "description": "How to bring up a dealer plus a line-up of bot agents with the launcher scripts in bin/.", "tags": ["arena", "docker", "agents", "runbook"], "group": "runbooks", "sz": 29, "body": "Three launcher scripts in `bin/` bring up a dealer plus agents via Docker\nCompose, from simplest to most flexible:\n\n| Script | Line-up | External deps |\n|---|---|---|\n| `./bin/botarena` | Full 9-handed ring of every `pkcore` rule archetype | none |\n| `./bin/aiarena` | Fixed 3 rule bots + 3 local LLMs (the full demo \u2014 see repo `DEMO.md`) | Ollama on host |\n| `./bin/arena` | Any line-up you name, from the `arena.toml` registry | depends on agents |\n\n# Examples\n\n```sh\n./bin/arena gto gto lag llama     # two GTO bots, a LAG, one llama\n./bin/arena gto:3 claude          # colon multiplicity: 3 GTO + 1 Claude\nmake arena PLAYERS=\"gto lag llama\"\nmake arena-down                   # force-tear-down ALL arena containers + volumes\n```\n\n`arena.toml` maps short names to an agent type (`rules`, `ollama`, `claude`,\n`gemini`) and config. The [claude agent](/crates/pkdealer_agent_claude.md)\nneeds `ANTHROPIC_API_KEY` (live, billed); [rules](/crates/pkdealer_agent_rules.md)\nand [ollama](/crates/pkdealer_agent_ollama.md) agents run fully locally.\n\nThe arena stack also brings up the full telemetry stack \u2014 see the\n[observability runbook](/runbooks/observability.md)."}, {"id": "runbooks/developer-workflow", "type": "Runbook", "title": "Developer workflow \u2014 build, test, lint", "description": "The everyday commands and CI-equivalent checks for the pkdealer workspace.", "tags": ["make", "cargo", "ci", "testing", "runbook"], "group": "runbooks", "sz": 29, "body": "GNU make wraps everything (`make help` lists all targets; on macOS use\n`gmake` if BSD make errors).\n\n# Examples\n\n```sh\nmake build            # cargo build --workspace (debug)\nmake test             # cargo test --workspace --all-features\nmake check            # fast compile check\nmake clippy-pedantic  # clippy with -Dclippy::pedantic (same as CI)\nmake fmt / fmt-check  # format / verify formatting\nmake ci-local         # full local CI: fmt-check clippy-pedantic test doc\nmake audit            # cargo-deny advisories check\n```\n\n# CI workflows\n\n| Workflow | Trigger | What it does |\n|---|---|---|\n| `CI.yaml` | push / PR | fmt-check, clippy-pedantic, test, doc |\n| `workspace-check.yaml` | push / PR | `cargo-deny`, `cargo-udeps` |\n| `audit.yml` | schedule + push | `cargo audit` advisory scan |\n\n# Project conventions\n\n* Rust \u2265 1.85, edition 2024; nightly only for `cargo-udeps`.\n* No `unwrap()` / `expect()` / `panic!()` in library code; every public item\n  needs doc comments with doc tests and unit tests (see repo `CLAUDE.md`).\n* Test fn names are not prefixed with `test_`."}, {"id": "runbooks/observability", "type": "Runbook", "title": "Observability \u2014 OpenTelemetry stack", "description": "Bringing up and configuring the OTel collector, Jaeger, Prometheus, and Grafana alongside the dealer.", "tags": ["otel", "jaeger", "prometheus", "grafana", "runbook"], "group": "runbooks", "sz": 27, "body": "The [dealer service](/crates/pkdealer_service.md) is OpenTelemetry-\ninstrumented, and the LLM agents\n([claude](/crates/pkdealer_agent_claude.md),\n[ollama](/crates/pkdealer_agent_ollama.md)) emit `gen_ai` spans so model\ncalls are traceable end-to-end.\n\n# Steps\n\n```sh\ndocker compose up -d --build   # dealer + collector + Jaeger + Prometheus + Grafana\nmake ddown                     # tear down (docker compose down -v)\n```\n\nStack config lives in `ops/` (`otel-collector.yaml`, `prometheus.yml`,\n`grafana/`). Full env-var reference and quickstart:\n`crates/pkdealer_service/README.md`.\n\n# Gotchas\n\n* Set `OTEL_SDK_DISABLED=true` when running tests or bare `cargo run`\n  without a collector \u2014 otherwise the SDK retries exports noisily."}], EDGES=[{"source": "crates/pkdealer_agent_claude", "target": "crates/pkdealer_agent_llm"}, {"source": "crates/pkdealer_agent_claude", "target": "runbooks/observability"}, {"source": "crates/pkdealer_agent_core", "target": "crates/pkdealer_service"}, {"source": "crates/pkdealer_agent_core", "target": "interfaces/dealer-grpc-api"}, {"source": "crates/pkdealer_agent_core", "target": "crates/pkdealer_agent_random"}, {"source": "crates/pkdealer_agent_core", "target": "crates/pkdealer_agent_rules"}, {"source": "crates/pkdealer_agent_core", "target": "crates/pkdealer_agent_claude"}, {"source": "crates/pkdealer_agent_core", "target": "crates/pkdealer_agent_ollama"}, {"source": "crates/pkdealer_agent_llm", "target": "crates/pkdealer_agent_claude"}, {"source": "crates/pkdealer_agent_llm", "target": "crates/pkdealer_agent_ollama"}, {"source": "crates/pkdealer_agent_ollama", "target": "crates/pkdealer_agent_llm"}, {"source": "crates/pkdealer_agent_ollama", "target": "runbooks/observability"}, {"source": "crates/pkdealer_agent_random", "target": "crates/pkdealer_agent_core"}, {"source": "crates/pkdealer_agent_rules", "target": "runbooks/arena"}, {"source": "crates/pkdealer_agent_rules", "target": "crates/pkdealer_agent_core"}, {"source": "crates/pkdealer_client", "target": "crates/pkdealer_service"}, {"source": "crates/pkdealer_costsim", "target": "interf const PALETTE=["#6E56CF","#D97757","#22C55E","#3B82F6","#EAB308","#EC4899","#14B8A6","#F97316","#A855F7","#0EA5E9","#84CC16","#EF4444","#64748B"];
const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
const outL={}, inL={};
NODES.forEach(n=>{outL[n.id]=[];inL[n.id]=[];});
EDGES.forEach(e=>{outL[e.source].push(e.target);inL[e.target].push(e.source);});
const types=[...new Set(NODES.map(n=>n.type))].sort();
const color=Object.fromEntries(types.map((t,i)=>[t,PALETTE[i%PALETTE.length]]));
const off=new Set();
const cy=cytoscape({container:document.getElementById('cy'),minZoom:.2,maxZoom:1.6,wheelSensitivity:.2,
 elements:[...NODES.map(n=>({data:{...n,c:color[n.type]}})),...EDGES.map(e=>({data:e}))],
 style:[
  {selector:'node',style:{'background-color':'data(c)','label':'data(title)','color':'#e6e8ee',
   'font-size':10,'text-wrap':'wrap','text-max-width':120,'text-valign':'bottom','text-margin-y':4,
   'text-outline-width':2,'text-outline-color':'#0e0f13','min-zoomed-font-size':6,
   'width':'data(sz)','height':'data(sz)'}},
  {selector:'edge',style:{'width':1.2,'line-color':'#3a4150','target-arrow-color':'#3a4150',
   'target-arrow-shape':'triangle','arrow-scale':.8,'curve-style':'bezier','opacity':.7}},
  {selector:'.dim',style:{'opacity':.10}},{selector:'.hl',style:{'border-width':3,'border-color':'#fff'}}
 ],
 layout:{name:'cose',animate:false,nodeRepulsion:9000,idealEdgeLength:90,padding:40}});
const side=document.getElementById('side');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function relList(title,arr){if(!arr.length)return'';
 return `<div class="rel"><h4>${title}</h4>${arr.map(id=>`<a data-go="${esc(id)}">${esc((byId[id]||{}).title||id)}</a>`).join('')}</div>`;}
function show(id){const n=byId[id];if(!n)return;const c=color[n.type];
 side.innerHTML=`<span class="type" style="background:${c}">${esc(n.type)}</span>
 <h2>${esc(n.title)}</h2><div class="desc">${esc(n.description)||'<span class=empty>no description</span>'}</div>
 <div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
 ${relList('Links to',outL[id])}${relList('Cited by',inL[id])}
 <div class="body">${n.body?DOMPurify.sanitize(marked.parse(n.body)):'<span class=empty>empty body</span>'}</div>`;
 side.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>select(a.getAttribute('data-go')));}
function select(id){const ele=cy.getElementById(id);if(!ele.length)return;show(id);
 cy.elements().removeClass('hl').addClass('dim');const nb=ele.closedNeighborhood();nb.removeClass('dim');ele.addClass('hl');
 cy.animate({center:{eles:ele},duration:250});
 try{if(decodeURIComponent((location.hash||'').slice(1))!==id)location.hash=encodeURIComponent(id);}catch(e){}}
cy.on('tap','node',e=>select(e.target.id()));
cy.on('tap',e=>{if(e.target===cy)cy.elements().removeClass('dim hl');});
function applyFilter(){const q=document.getElementById('search').value.toLowerCase();const ty=document.getElementById('type').value;
 cy.batch(()=>cy.nodes().forEach(n=>{const d=n.data();
  const m=(!q||(d.title+' '+d.type+' '+d.description+' '+(d.tags||[]).join(' ')).toLowerCase().includes(q))
        &&(!ty||d.type===ty)&&!off.has(d.type);
  n.style('display',m?'element':'none');}));}
let debounce;
document.getElementById('search').oninput=()=>{clearTimeout(debounce);debounce=setTimeout(applyFilter,150);};
document.getElementById('type').oninput=applyFilter;
const tysel=document.getElementById('type');types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tysel.appendChild(o);});
let curLayout='cose';
document.getElementById('layout').onchange=e=>{const v=e.target.value;
 if(v==='cose'&&NODES.length>1000&&!confirm(`force layout on ${NODES.length} concepts can freeze this tab — run anyway?`)){e.target.value=curLayout;return;}
 curLayout=v;cy.layout({name:v,animate:true,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();};
document.getElementById('legend').innerHTML=types.map(t=>`<span class="chip" data-t="${esc(t)}"><span class="dot" style="background:${color[t]}"></span>${esc(t)} (${NODES.filter(n=>n.type===t).length})</span>`).join('');
document.querySelectorAll('#legend .chip').forEach(ch=>ch.onclick=()=>{const t=ch.getAttribute('data-t');
 if(off.has(t)){off.delete(t);ch.classList.remove('off');}else{off.add(t);ch.classList.add('off');}applyFilter();});
document.getElementById('layout').value='cose';
const Q=new URLSearchParams(location.search),QL=Q.get('layout'),QS=Q.get('select');
if(QL&&[...document.querySelectorAll('#layout option')].some(o=>o.value===QL)){document.getElementById('layout').value=QL;curLayout=QL;cy.layout({name:QL,animate:false,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();}
function fromHash(){try{const h=decodeURIComponent((location.hash||'').slice(1));if(h&&byId[h])select(h);}catch(e){}}
addEventListener('hashchange',fromHash);
if(QS&&byId[QS])select(QS);else fromHash();
</script></body></html>
