[package]
name = "pkdealer_backchannel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "EPIC-70 Vector-B collusion backchannel broker: relays CardShares between colluding agents"
keywords = ["poker", "collusion", "broker", "epic-70"]
categories = ["games", "network-programming"]
rust-version = "1.85"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pkdealer_backchannel"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.22", features = ["v4", "serde"] }

[dev-dependencies]
# Only the `CardShare` doc-test and the unit tests serialize; the broker itself
# relays raw lines. Keeping this out of [dependencies] keeps cargo-udeps green.
serde_json = "1"
