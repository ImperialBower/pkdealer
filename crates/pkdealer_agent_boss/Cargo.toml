[package]
name = "pkdealer_agent_boss"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Live blind collusion detector: polls ExportSession, redacts at ingest, emits per-pair SPRT verdicts over OTel (EPIC-70 Phase 4)"
keywords = ["poker", "collusion", "detection", "observer", "opentelemetry"]
categories = ["games", "command-line-utilities"]
rust-version = "1.85"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pkdealer_agent_boss"
path = "src/main.rs"

[dependencies]
pkcore = { version = "0.6.0", features = ["bot-profiles"] }
pkdealer_boss = { path = "../pkdealer_boss" }
pkdealer_proto = { path = "../pkdealer_proto" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
uuid = { version = "1.22", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.12", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.31"
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", features = ["grpc-tonic", "metrics", "trace"] }
