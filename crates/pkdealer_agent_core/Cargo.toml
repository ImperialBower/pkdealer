[package]
name = "pkdealer_agent_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared gRPC agent infrastructure for pkdealer bot agents"
keywords = ["poker", "grpc", "agent", "bot"]
categories = ["games"]
rust-version = "1.85"

[dependencies]
pkdealer_proto = { path = "../pkdealer_proto", version = "0.1.11" }
pkcore = { version = "0.3.1" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
tonic = { version = "0.12", features = ["transport"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.22", features = ["v4"] }

[features]
# EPIC-70: colluding-agent machinery. Off by default — a default build is
# byte-for-byte the honest agent.
collusion = []
