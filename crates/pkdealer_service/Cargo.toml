[package]
name = "pkdealer_service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "gRPC service for poker dealer functionality"
keywords = ["poker", "grpc", "dealer", "service"]
categories = ["games"]
rust-version = "1.94.1"

[[bin]]
name = "pkdealer_service"
path = "src/main.rs"

[dependencies]
axum = "0.7"
pkcore = "0.0.48"
pkdealer_proto = { version = "0.1.6", path = "../pkdealer_proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport"] }
tonic-reflection = "0.12"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
