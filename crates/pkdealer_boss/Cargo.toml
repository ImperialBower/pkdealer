[package]
name = "pkdealer_boss"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The Boss: blind collusion detection over redacted pkdealer arena sessions (EPIC-70)"
keywords = ["poker", "collusion", "detection", "sprt", "analysis"]
categories = ["games", "command-line-utilities"]
rust-version = "1.85"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pkdealer_boss"
path = "src/main.rs"

[dependencies]
pkcore = { version = "0.7.0", features = ["bot-profiles"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_bw = "2.5"
uuid = { version = "1.22", features = ["v4"] }
