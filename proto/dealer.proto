syntax = "proto3";

package pkdealer.dealer.v1;

// The Dealer service manages a poker table: seating players, dealing hands,
// processing actions, and resolving showdowns.
//
// Authentication: mutating RPCs require the `x-player-token` gRPC metadata
// value (UUID issued by SeatPlayer / SeatPlayerAt). Act validates the token
// matches the acting seat. RemovePlayer validates the token matches the seat
// being removed. GetStatus and StreamEvents use the token to control
// hole-card visibility.
service DealerService {
  rpc Ping(PingRequest) returns (PingReply);

  // Seat a new player at the next available seat.
  rpc SeatPlayer(SeatPlayerRequest) returns (SeatPlayerResponse);

  // Seat a player at a specific seat number.
  rpc SeatPlayerAt(SeatPlayerAtRequest) returns (SeatPlayerAtResponse);

  // Remove a player from their seat. Requires x-player-token matching the seat.
  rpc RemovePlayer(RemovePlayerRequest) returns (RemovePlayerResponse);

  // Start a new hand: shuffle, post blinds, deal hole cards.
  rpc StartHand(StartHandRequest) returns (StartHandResponse);

  // Process a player action. Streets and hand resolution advance automatically.
  // Requires x-player-token matching the acting seat.
  rpc Act(ActRequest) returns (ActResponse);

  // Get the current table status. Hole card visibility is controlled by
  // x-player-token metadata (player sees own cards; spectator token sees all).
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // Get who is next to act and the current betting context.
  rpc GetNextToAct(GetNextToActRequest) returns (GetNextToActResponse);

  // Get the current community cards.
  rpc GetBoard(GetBoardRequest) returns (GetBoardResponse);

  // Get chip counts for all seated players.
  rpc GetChips(GetChipsRequest) returns (GetChipsResponse);

  // Get the current pot size.
  rpc GetPot(GetPotRequest) returns (GetPotResponse);

  // Get the full event log as formatted text.
  rpc GetEventLog(GetEventLogRequest) returns (GetEventLogResponse);

  // Get static table configuration (blinds, seat count, variant).
  rpc GetTableConfig(GetTableConfigRequest) returns (GetTableConfigResponse);

  // Add chips to the caller's seat. Requires x-player-token. If the seat has
  // zero chips, the rebuy-on-bust flag must be enabled. If the seat still has
  // chips, the top-up flag must be enabled AND no hand may be in progress.
  // `chips == 0` falls back to the service default rebuy amount.
  rpc Rebuy(RebuyRequest) returns (RebuyResponse);

  // Per-player aggregates (chips, withdrawn, profit/loss) for every occupied
  // seat. Useful for tracking cumulative win/loss across long bot sessions.
  rpc GetPlayerStats(GetPlayerStatsRequest) returns (GetPlayerStatsResponse);

  // Stream all table events as they happen. Supply player_token to receive
  // your own hole cards in event status snapshots.
  rpc StreamEvents(StreamEventsRequest) returns (stream TableEvent);

  // Export every hand recorded so far this session as a serialized pkcore
  // HandCollection (YAML or JSON). Requires the spectator token via
  // x-player-token, because the payload contains every player's hole cards.
  rpc ExportSession(ExportSessionRequest) returns (ExportSessionResponse);

  // Lightweight progress check: how many hands are buffered, the id range, and
  // whether/where hands are persisted to disk. No token required (no cards).
  rpc GetSessionInfo(GetSessionInfoRequest) returns (GetSessionInfoResponse);
}

// ── Enums ─────────────────────────────────────────────────────────────────────

enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;
  ACTION_TYPE_BET = 1;
  ACTION_TYPE_CALL = 2;
  ACTION_TYPE_CHECK = 3;
  ACTION_TYPE_RAISE = 4;
  ACTION_TYPE_ALL_IN = 5;
  ACTION_TYPE_FOLD = 6;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_PLAYER_SEATED = 1;
  EVENT_TYPE_PLAYER_REMOVED = 2;
  EVENT_TYPE_HAND_STARTED = 3;
  EVENT_TYPE_PLAYER_ACTION = 4;
  EVENT_TYPE_STREET_ADVANCED = 5;
  EVENT_TYPE_HAND_ENDED = 6;
  EVENT_TYPE_PLAYER_REBOUGHT = 7;
  EVENT_TYPE_ROUND_ENDED = 8;
}

// Represents the player's action state within the current betting round.
enum PlayerState {
  PLAYER_STATE_UNSPECIFIED = 0;
  PLAYER_STATE_READY = 1;       // Seated, waiting for next hand.
  PLAYER_STATE_YET_TO_ACT = 2;  // Has not acted this street.
  PLAYER_STATE_CHECKED = 3;
  PLAYER_STATE_CALLED = 4;
  PLAYER_STATE_BET = 5;
  PLAYER_STATE_RAISED = 6;      // Includes re-raise.
  PLAYER_STATE_ALL_IN = 7;      // Includes showdown (committed all chips).
  PLAYER_STATE_FOLDED = 8;
  PLAYER_STATE_OUT = 9;         // Eliminated (busted out).
  PLAYER_STATE_BLIND = 10;      // Posted forced blind this round.
}

enum Street {
  STREET_UNSPECIFIED = 0;
  STREET_PREFLOP = 1;
  STREET_FLOP = 2;
  STREET_TURN = 3;
  STREET_RIVER = 4;
}

// ── Messages ──────────────────────────────────────────────────────────────────

message PingRequest { string client_id = 1; }
message PingReply   { string message   = 1; }

message SeatPlayerRequest {
  string name  = 1;
  uint32 chips = 2;  // 0 → server default (10 000). Ignored on resume.
  // Optional. If a previous SeatPlayer/SeatPlayerAt call from this client
  // supplied the same client_secret AND that seat has not been removed,
  // the existing seat and player_token are returned and `resumed` is true.
  // Ignored if empty. Opaque to the service.
  string client_secret = 3;
}
message SeatPlayerResponse {
  oneof result {
    uint32 seat_number = 1;
    string error       = 2;
  }
  // UUID to use as x-player-token metadata on future RPCs.
  string player_token = 3;
  // True if this response re-attached to an existing seat via client_secret;
  // false if a fresh seat was allocated.
  bool   resumed      = 4;
}

message SeatPlayerAtRequest {
  uint32 seat  = 1;
  string name  = 2;
  uint32 chips = 3;  // 0 → server default. Ignored on resume.
  // See SeatPlayerRequest.client_secret. On resume, the `seat` field is
  // validated to match the seat the secret was originally bound to; mismatch
  // returns an error.
  string client_secret = 4;
}
message SeatPlayerAtResponse {
  oneof result {
    bool   success = 1;
    string error   = 2;
  }
  string player_token = 3;
  bool   resumed      = 4;
}

message RemovePlayerRequest  { uint32 seat = 1; }
message RemovePlayerResponse {
  oneof result {
    string player_name = 1;
    string error       = 2;
  }
}

message StartHandRequest {}
message StartHandResponse {
  oneof result {
    TableStatus status = 1;
    string      error  = 2;
  }
}

message ActRequest { PlayerAction action = 1; }
message ActResponse {
  oneof result {
    ActionResult action_result = 1;
    string       error         = 2;
  }
}

// Per-action provenance: what an agent *produced* versus what the table
// *applied*. Optional and analysis-only — game logic ignores it. Populated by
// arena agents (agent_core / agent_llm); absent for plain client submissions.
// Mirrors `pkcore::hand_history::AgentFidelity` (pkcore >= 0.1.3); the service
// zips these onto the recorded HandHistory via `attach_agent_fidelity`.
message AgentFidelity {
  optional string     raw_response         = 1;  // raw LLM/agent response text
  optional bool       was_coerced          = 2;  // applied action != intended
  optional ActionType intended_action_type = 3;  // action the agent intended
  optional uint32     intended_amount      = 4;  // intended bet/raise size (chips)
  optional uint32     input_tokens         = 5;  // prompt tokens (LLM)
  optional uint32     output_tokens        = 6;  // completion tokens (LLM)
  optional string     model                = 7;  // model / agent id
}

message PlayerAction {
  uint32     seat        = 1;
  ActionType action_type = 2;
  uint32     amount      = 3;  // used for Bet and Raise only

  // Optional agent-fidelity provenance (EPIC-25 Phase 4). Absent for plain
  // client actions; populated by arena agents. Ignored by game logic; recorded
  // for analysis via HandHistory::attach_agent_fidelity.
  AgentFidelity agent = 4;
}

message ActionResult {
  uint32     next_to_act   = 1;
  uint32     pot           = 2;
  bool       hand_complete = 3;
  HandResult hand_result   = 4;  // populated when hand_complete is true
}

message HandResult {
  repeated WinnerInfo  winners     = 1;
  repeated PlayerChips final_chips = 2;
}

message WinnerInfo {
  uint32 seat             = 1;
  string player_name      = 2;
  uint32 amount_won       = 3;
  string hand_description = 4;  // e.g. "Pair", "Flush" — empty on fold win
  // The winning 5-card hand at showdown, e.g. "A♠ K♠ Q♠ J♠ T♠". Empty on a
  // fold win (no showdown).
  string winning_cards    = 5;
}

message GetStatusRequest {}
message GetStatusResponse { TableStatus status = 1; }

message TableStatus {
  repeated SeatInfo seats            = 1;
  string            board            = 2;
  uint32            pot              = 3;
  uint32            next_to_act      = 4;
  bool              hand_in_progress = 5;
  bool              game_over        = 6;
  Street            current_street   = 7;
  // Live forced-bet blinds for the current/next hand. Tracks blind-schedule
  // escalation so spectators see the real stakes, not a once-fetched config.
  uint32            small_blind      = 8;
  uint32            big_blind        = 9;
  // Button and blind seat numbers for position-tag display (BTN/SB/BB).
  // Populated so remote spectators can render position labels without
  // re-implementing the heads-up vs. full-ring blind-assignment rules.
  uint32            button_seat      = 10;
  uint32            small_blind_seat = 11;
  uint32            big_blind_seat   = 12;
  uint32            round_number     = 13;
}

message SeatInfo {
  uint32      seat_number   = 1;
  string      player_name   = 2;
  uint32      chips         = 3;
  string      cards         = 4;  // hole cards; redacted unless caller owns this seat
  PlayerState state         = 5;
  // Cumulative chips brought to the table (initial buy-in + every rebuy).
  uint32      withdrawn     = 6;
  // Chips committed to the current pot this hand.
  uint32      chips_in_play = 7;
  // chips + chips_in_play - withdrawn. Signed; negative means net loss.
  sint32      profit_loss   = 8;
  // Chips wagered on the current betting round only; reset to 0 when the street
  // advances. Use this (not chips_in_play) for a per-street "bet" display.
  uint32      bet           = 9;
  // Cumulative prompt tokens this session (LLM seats; 0 for bots).
  uint64 input_tokens  = 10;
  // Cumulative completion tokens this session (LLM seats; 0 for bots).
  uint64 output_tokens = 11;
  // Notional cost of this seat's tokens in integer micro-USD (1e-6 USD); 0 when
  // unpriceable (no pricing table, model not priced, or bot). Divide by 1e6 to
  // display. Computed from session tokens + PKDEALER_PRICING / PKDEALER_PRICE_AS.
  uint64 cost_micro_usd = 12;
}

message GetNextToActRequest {}
message GetNextToActResponse {
  oneof result {
    NextToActInfo info    = 1;
    string        message = 2;  // e.g. "No hand in progress"
  }
}

message NextToActInfo {
  uint32 seat           = 1;
  string player_name    = 2;
  uint32 chips          = 3;
  uint32 pot            = 4;
  uint32 amount_to_call = 5;
  uint32 min_raise      = 6;
  uint32 current_bet    = 7;
}

message GetBoardRequest  {}
message GetBoardResponse { string board = 1; }

message GetChipsRequest  {}
message GetChipsResponse { repeated PlayerChips chips = 1; }

message PlayerChips {
  uint32 seat        = 1;
  string player_name = 2;
  uint32 chips       = 3;
}

message GetPotRequest  {}
message GetPotResponse { uint32 pot = 1; }

message GetEventLogRequest  {}
message GetEventLogResponse { string log = 1; }

// Serialization format for an exported HandCollection.
enum RecordFormat {
  RECORD_FORMAT_UNSPECIFIED = 0;  // server default (YAML)
  RECORD_FORMAT_YAML = 1;
  RECORD_FORMAT_JSON = 2;
}

message ExportSessionRequest {
  // Output format. UNSPECIFIED defaults to YAML.
  RecordFormat format = 1;
  // If true, the in-memory buffer is cleared after a successful export so the
  // next export starts fresh. Default false (idempotent reads).
  bool drain = 2;
}
message ExportSessionResponse {
  // Number of hands in the exported collection.
  uint32 hand_count = 1;
  // The session's HandCollection serialized in `format`.
  string payload = 2;
  // Source tag embedded in each recorded hand (always "arena").
  string source = 3;
  // The format `payload` is encoded in (echoes the resolved request format).
  RecordFormat format = 4;
}

message GetSessionInfoRequest {}
message GetSessionInfoResponse {
  // Always true in Phase 2 (in-memory recording is on by default).
  bool recording_enabled = 1;
  // Number of hands currently buffered in memory.
  uint32 hand_count = 2;
  // Id of the oldest buffered hand (empty when none).
  string first_hand_id = 3;
  // Id of the newest buffered hand (empty when none).
  string last_hand_id = 4;
  // Absolute path of the session YAML file, or empty if disk persistence is off.
  string record_dir = 5;
}

message GetTableConfigRequest {}
message GetTableConfigResponse { TableConfig config = 1; }
message TableConfig {
  uint32 seat_count             = 1;
  uint32 small_blind            = 2;
  uint32 big_blind              = 3;
  string variant                = 4;  // e.g. "No-Limit Hold'em"
  uint32 default_chips          = 5;
  uint32 default_rebuy_amount   = 6;
  bool   rebuy_on_bust_enabled  = 7;
  bool   topup_enabled          = 8;
}

message RebuyRequest {
  // Chips to add to the caller's seat. 0 = use service default rebuy amount.
  // Seat is resolved via x-player-token metadata.
  uint32 chips = 1;
}
message RebuyResponse {
  oneof result {
    RebuyInfo info  = 1;
    string    error = 2;
  }
}
message RebuyInfo {
  uint32 seat          = 1;
  uint32 new_chips     = 2;
  uint32 new_withdrawn = 3;
  string reason        = 4;  // "bust" | "topup"
}

message GetPlayerStatsRequest {}
message GetPlayerStatsResponse { repeated PlayerStats stats = 1; }
message PlayerStats {
  uint32 seat          = 1;
  string player_name   = 2;
  uint32 chips         = 3;
  uint32 chips_in_play = 4;
  uint32 withdrawn     = 5;
  sint32 profit_loss   = 6;
}

message StreamEventsRequest {
  // Optional. Supply your player_token to receive your hole cards in status
  // snapshots embedded in events. Omit for a fully redacted view.
  string player_token = 1;
}

message TableEvent {
  uint64      timestamp      = 1;
  EventType   event_type     = 2;
  string      description    = 3;
  TableStatus current_status = 4;
}
